<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIT v3.185 · Real-Time 1v1</title>
<style>
:root{--bg:#eceae4;--fg:#1b1b1f;--panel:#fff;--accent:#d6452b;--blue:#2b6fd6;--ring:#d6d0c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--fg:#eee;--panel:#1d2128;--accent:#ff6a4d;--blue:#5a9bff;--ring:#272c35}}
:root[data-theme="dark"]{--bg:#0f1115;--fg:#eee;--panel:#1d2128;--accent:#ff6a4d;--blue:#5a9bff;--ring:#272c35}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column}
#c{flex:1;min-height:0;width:100%;display:block}
#pad{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 12px;gap:10px}
#dp{display:grid;grid-template-columns:repeat(3,54px);grid-auto-rows:46px;gap:5px}   /* VISION v3.21 — D-pad returns (Kev direct) */
#mv{display:flex;flex-direction:column;gap:6px;align-items:flex-start}   /* VISION v3.65 — CONTROLS: the movement column — the STICK/D-PAD toggle sits above the active control (D-pad or stick), so the toggle is next to the control it switches */
#ctl-toggle{height:30px;font-size:12px;padding:0 10px}   /* VISION v3.65 — CONTROLS: the toggle is a small mode button like AUTO/JUMP, not an attack button — it names the mode you switch TO (STICK while the D-pad is showing, D-PAD while the stick is showing) */
#stk{position:relative;width:124px;height:124px;border-radius:50%;background:var(--panel);border:1px solid var(--ring);touch-action:none}   /* VISION v3.65 — CONTROLS: the joystick base — a circle in the same slot as the D-pad, a separate DOM element (not on the canvas) so its pointer events never reach the camera drag/pinch handlers */
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);touch-action:none}   /* VISION v3.65 — CONTROLS: the draggable knob — centred at rest, displaced by stickSet up to 35 px ((124-54)/2) in the push direction */
#dp[hidden],#stk[hidden]{display:none}   /* VISION v3.65 — CONTROLS: only the active control is shown — #dp's display:grid would otherwise override the [hidden] UA rule, so the rule is explicit */

#ab{display:grid;grid-template-columns:repeat(2,96px);grid-auto-rows:64px;gap:6px}   /* VISION v3.31 — CONTROLS: four big attack buttons only (Punch/Kick/Guard/Throw) — 96x64 px, up from 64x46, so they are easy to hit; AUTO and JUMP sit in the same grid as small mode/movement buttons (see .small below), not attack buttons */
button{background:var(--panel);color:var(--fg);border:1px solid var(--ring);border-radius:12px;font:600 16px system-ui;touch-action:none}
button.on{background:var(--accent);color:#fff}
#ab button.held{font-weight:900;letter-spacing:.09em;text-shadow:0 0 .5px currentColor,0 0 .5px currentColor}
#ab button.heavy{font-weight:900;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 0 2px var(--accent) inset,0 0 8px var(--accent)}
#u{grid-column:2}
#cam-btn{grid-column:1/-1;order:9}
#ab button.small{height:36px;align-self:end;font-size:13px}   /* VISION v3.31 — CONTROLS: AUTO (mode toggle) and JUMP (movement control) stay small — they are not attack buttons, so they do not get the big-button treatment */
</style>
<style id="design385">
/* v3.85 DESIGN — controls keep their layout, sizes and behaviour; this only restyles them and lets the two clusters share a narrow screen (the 96 px attack buttons used to run off the right edge below ~410 px) */
:root{--bg2:#e0ddd5;--edge:rgba(40,28,16,.14);--lift:0 1px 0 rgba(255,255,255,.7) inset,0 -2px 0 rgba(40,28,16,.07) inset,0 3px 8px rgba(40,28,16,.14);--glass:rgba(24,18,16,.58)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg2:#0a0c10;--edge:rgba(255,255,255,.08);--lift:0 1px 0 rgba(255,255,255,.06) inset,0 -2px 0 rgba(0,0,0,.35) inset,0 3px 8px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg2:#0a0c10;--edge:rgba(255,255,255,.08);--lift:0 1px 0 rgba(255,255,255,.06) inset,0 -2px 0 rgba(0,0,0,.35) inset,0 3px 8px rgba(0,0,0,.45)}
#pad{background:linear-gradient(180deg,var(--bg),var(--bg2));border-top:1px solid var(--edge);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));gap:8px;box-shadow:0 -6px 14px rgba(20,12,6,.10)}
#mv{flex:0 0 auto}
#dp{grid-template-columns:repeat(3,clamp(44px,13.4vw,54px));grid-auto-rows:clamp(40px,11.8vw,46px);gap:5px}
#ab{flex:1 1 0;min-width:0;max-width:210px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(54px,16vw,64px);gap:6px}
#ab button.small{height:clamp(32px,9.4vw,36px)}
button{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 90%,var(--bg2)));border:1px solid var(--edge);border-radius:14px;box-shadow:var(--lift);font:700 14px system-ui;letter-spacing:.07em;transition:transform .06s,box-shadow .06s,background .12s;-webkit-tap-highlight-color:transparent;min-width:0;padding:0 4px}
#ab button.small,#ctl-toggle{font-size:12px;letter-spacing:.06em}
#interact-btn{font-size:13px;letter-spacing:.03em}
#dp button{font-size:15px;letter-spacing:0}
button:active,button.on{transform:translateY(1px) scale(.975);box-shadow:0 1px 0 rgba(0,0,0,.18) inset,0 1px 3px rgba(0,0,0,.2)}
button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:#fff;border-color:transparent}
#ab button[data-k=p]{border-bottom:3px solid var(--accent)}
#ab button[data-k=k]{border-bottom:3px solid var(--blue)}
#ab button[data-k=g]{border-bottom:3px solid #ff2d55}
#ab button[data-k=ip]{border-bottom:3px solid #8a5bd6}
#stk{background:radial-gradient(circle at 50% 38%,var(--panel),color-mix(in srgb,var(--panel) 85%,var(--bg2)));box-shadow:var(--lift);border:1px solid var(--edge)}
#knob{background:radial-gradient(circle at 38% 30%,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));box-shadow:0 3px 8px rgba(0,0,0,.35)}
#hit-review{padding:5px 12px!important;gap:8px!important;flex-wrap:nowrap!important;font-size:11px!important;background:linear-gradient(180deg,#1d2128,#14171c)!important;border-top:1px solid rgba(255,255,255,.06)}
#hit-review strong{letter-spacing:.12em;font-size:10px;white-space:nowrap}
#hit-metrics{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
#hit-review button{font-size:11px!important;padding:4px 9px!important;border-radius:10px;letter-spacing:.03em;white-space:nowrap;box-shadow:none;background:#2b313b;color:#f2e5d5;border:1px solid rgba(255,255,255,.1)}
#hit-review button:disabled{opacity:.4}
</style><style id="landscape3103">
/* v3.103 LANDSCAPE — when the screen is wider than tall the canvas fills the whole screen and the controls float over it: movement bottom-left, actions bottom-right, recorder bottom-centre. Portrait is unchanged. */
@media (orientation:landscape){
#app{position:relative;display:block}
#c{position:absolute;inset:0;width:100%;height:100%}
#pad{position:absolute;left:0;right:0;bottom:0;background:none;border:0;box-shadow:none;pointer-events:none;align-items:flex-end;padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
#pad>*{pointer-events:auto}
#pad button{opacity:.86}
#stk{opacity:.9;width:clamp(104px,30vh,132px);height:clamp(104px,30vh,132px)}
#dp{grid-template-columns:repeat(3,clamp(40px,12vh,54px));grid-auto-rows:clamp(36px,11vh,46px)}
#app{--sq:clamp(44px,13.5vh,56px)}
#ab{flex:0 0 auto;max-width:none;width:clamp(120px,16.5vw,146px);grid-auto-rows:clamp(40px,12.5vh,60px)}
#ab{grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-rows:auto;gap:4px;align-items:end}
#ab button{border-radius:9px}
#ab button[data-k=p],#ab button[data-k=k],#ab button[data-k=g],#ab button[data-k=ip]{grid-column:span 1;width:var(--sq);height:var(--sq);aspect-ratio:1/1;font-size:11px;letter-spacing:.04em;border-bottom-width:3px}
#ab{width:calc(var(--sq)*2 + 5px)!important;grid-template-columns:repeat(2,var(--sq))!important;gap:5px!important}
#ab button.small,#interact-btn{grid-column:span 1;height:clamp(16px,4.8vh,20px);font-size:7px;letter-spacing:0;padding:0;border-radius:7px;align-self:end}
#interact-btn{grid-column:1/-1;order:4}
#ab #auto-btn,#ab #lock-btn,#ab #cam-btn{grid-column:span 1;order:3}
#ab button[data-k=j]{grid-column:1/-1;order:2;margin-top:4px;height:clamp(18px,5.6vh,24px);font-size:9px;letter-spacing:.14em}
#hit-review{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass)!important;border:0!important;border-radius:12px;padding:4px 8px!important;max-width:34vw}
#hit-review strong,#hit-metrics{display:none}
}
</style>
<style id="v3123">
/* v3.123 — touch layout: PUNCH and KICK are the big thumb buttons (side by side), GUARD / THROW / JUMP a smaller row underneath, utility buttons (AUTO / LOCK / CAM / INTERACT) fold out of a MENU button; all controls semi-transparent */
#app{--bw:clamp(56px,17vh,74px)}
#ab{position:relative;width:calc(var(--bw)*2 + 6px)!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-auto-rows:auto!important;gap:6px!important;align-items:stretch!important}
#ab button[data-k=p],#ab button[data-k=k]{grid-column:span 3!important;width:auto!important;height:var(--bw)!important;aspect-ratio:auto!important;font-size:13px!important;order:0}
#ab button.sm3{grid-column:span 2!important;aspect-ratio:auto!important;order:1!important;width:auto!important;height:clamp(24px,7vh,30px)!important;font-size:9px!important;letter-spacing:.02em;padding:0;margin:0!important;border-bottom-width:2px}
#ab #menu-btn{grid-column:1/-1!important;order:2!important;height:clamp(18px,5.4vh,22px)!important;font-size:8px!important;letter-spacing:.16em}
#fmenu{position:absolute;right:calc(100% + 8px);bottom:0;display:grid;grid-template-columns:repeat(2,minmax(54px,1fr));gap:6px;padding:6px;border-radius:12px;background:color-mix(in srgb,var(--panel) 55%,transparent);backdrop-filter:blur(4px)}
#fmenu[hidden]{display:none!important}
#fmenu button{grid-column:auto!important;order:0!important;height:30px!important;font-size:10px!important;letter-spacing:.04em;padding:0 8px;margin:0}
#fmenu #interact-btn{grid-column:1/-1!important}
#pad button,#ab button,#ctl-toggle,#dp button{background:color-mix(in srgb,var(--panel) 48%,transparent)!important;opacity:.78!important;backdrop-filter:blur(2px)}
#ab button.on,#pad button.on{background:color-mix(in srgb,var(--accent) 70%,transparent)!important}
#ab #menu-btn.open{background:color-mix(in srgb,var(--accent) 55%,transparent)!important}
</style>
<style id="v3124">
/* v3.124 — four equal square buttons (PUNCH KICK / GUARD THROW), JUMP as a horizontal bar underneath, MENU as a slim button on the right side; the menu folds out upward */
#app{--bw:clamp(48px,14.5vh,64px)}
#ab{width:calc(var(--bw)*2 + 6px + 28px)!important;grid-template-columns:var(--bw) var(--bw) 22px!important;grid-template-rows:var(--bw) var(--bw) auto!important;gap:6px!important}
#ab button[data-k=p],#ab button[data-k=k],#ab button[data-k=g],#ab button[data-k=ip]{grid-column:span 1!important;width:var(--bw)!important;height:var(--bw)!important;aspect-ratio:1/1!important;font-size:12px!important;order:0!important;padding:0;border-bottom-width:3px}
#ab button[data-k=j]{grid-column:1/3!important;grid-row:3!important;order:1!important;width:auto!important;height:clamp(20px,6vh,26px)!important;font-size:10px!important;letter-spacing:.18em}
#ab #menu-btn{grid-column:3!important;grid-row:1/3!important;order:1!important;width:22px!important;height:auto!important;padding:0;writing-mode:vertical-rl;font-size:9px!important;letter-spacing:.2em}
#ab #menu-btn.hold{background:linear-gradient(to top,color-mix(in srgb,var(--accent) 65%,transparent),transparent)!important;background-size:100% 0%;animation:mh .38s linear forwards}
@keyframes mh{to{background-size:100% 100%}}
#fmenu{right:0!important;bottom:calc(100% + 8px)!important}
</style>
</head><body>
<div id="app"><canvas id="c"></canvas>
<div id="pad">
<div id="mv"><button id="ctl-toggle">STICK</button><div id="dp"><button id="u" data-k="u">▲</button><button data-k="l" style="grid-row:2">◀</button><button data-k="d" style="grid-row:2">▼</button><button data-k="r" style="grid-row:2">▶</button></div><div id="stk" hidden><div id="knob"></div></div></div>
<div id="ab"><button data-k="p">PUNCH</button><button data-k="k">KICK</button><button data-k="g">GUARD</button><button data-k="ip">THROW</button><button data-k="j" class="sm3">JUMP</button><button id="menu-btn">MENU</button><div id="fmenu" hidden><button id="auto-btn" class="small">AUTO</button><button id="lock-btn" class="small">LOCK</button><button id="cam-btn" class="small">CAM</button><!-- VISION v3.78 — BUILDINGS: ENTERABLE + INTERACTIVE — the INTERACT button (same 96x64 size as the attack buttons, in the action grid) — triggers the nearest interactable (door / interior object), the same as the E key --><button id="interact-btn">INTERACT</button><button id="chars-btn" class="small">FIGHTERS</button></div></div>
</div>
<div id="hit-review" style="padding:7px 12px;background:#1d2128;color:#f2e5d5;font:12px system-ui;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<strong style="color:#e8aa75">HIT · THROW REVIEW</strong>
<span id="hit-metrics">No landings yet</span>
<button id="hit-record" style="font-size:12px;padding:5px">Record gameplay</button>
<button id="hit-stop" style="font-size:12px;padding:5px" disabled>Stop</button>
<a id="hit-save" style="color:#e8aa75" hidden>Save video</a>
</div></div>
<script async src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ================= CONFIG =================
const DT=1/60, GRAV=24, RING=1e4, FWD=3.7, BACK=2.5, STEPV=4.8;   /* v3.89 QUICK MOVEMENT: walk 2.3->3.7 m/s, back-walk 1.5->2.5, sidestep burst 3.4->4.8 (Kev Nov 10: general movement should be very quick) */
const CLR={pel:.14,neck:.14,head:.16,hl:.08,hr:.08,fl:.04,fr:.04};
/* v3.140 — LIMP KO BODY (Kev Nov 11: "when a character gets KO'd, their body should naturally fall against the ground, not into a pose"). A KO'd body used to blend from its touchdown pose into an authored rest pose (arched back, folded knee). Now the neck, head, hands and feet are particles hung off the pelvis: they keep the touchdown momentum, fall under gravity, are held by the fixed bone lengths (torso .55, neck .24, arm reach, leg reach), meet the floor at CLR height with Coulomb friction and a small bounce, and cannot pass through the torso or each other, so the shoulders slap down, the head rolls, and the limbs flop and settle where they land. Position-based, fixed step, deterministic; the pelvis is still driven by the existing landing code. Only hp<=0 bodies in st='down' use it; get-up and live knockdowns are untouched. */
const RG_J=['neck','head','hl','hr','fl','fr'],RG_IX={neck:1,head:2,hl:3,hr:4,fl:5,fr:6},RG_PEL=[0,.14,0];
function ragInit(f,P,vx,vz,vy){const R={q:{},W:{},n:0,calm:0,sl:0,tuck:null,hs:0,u:Math.max(0,Math.min(1,((f.tdSpd||8)-6)/4)),as:[0,1,2,3].map(i=>{const h=Math.sin((f.x||0)*12.9898+(f.z||0)*78.233+(f.tdSpd||0)*3.7+i*41.3)*43758.5453;return .6+.55*(h-Math.floor(h))})},ca=f.fx||1,sa=f.fz||0,lx=vx*ca+vz*sa,lz=-vx*sa+vz*ca,vd=Math.min(0,vy||0);
  for(const j of RG_J){const up=(j==='neck'||j==='head')?.6:.35;R.q[j]=[P[RG_IX[j]][0],P[RG_IX[j]][1],P[RG_IX[j]][2]];R.W[j]=[lx,vd*up-(vy===undefined?.5:0),lz]}
  R.tuck=null;R.side=R.as[0]>.82?(Math.abs(f.tdLat||0)>.4?Math.sign(f.tdLat):(R.as[1]>.875?1:-1)):0;R.xh=R.side>0?'hr':R.side<0?'hl':null;if(R.side)R.hs=R.side;   /* v3.141 — SIDE-LYING REST (reference video: the fallen body lies twisted on its side, not flat like a snow angel): about 60% of KO bodies settle onto a side — the one they were sliding toward — with both knees bent that way, the top arm draped across the chest and the head turned; the rest sprawl on the back/front as before. It emerges through the same floor-contact settling, not a pose blend. */R.hs=R.side||(R.as[3]<.9?-1:1);f._rg=R}   // one arm ends up under the body, the head turns to a side

function limpBend(r,e,L1,L2,sg,up){const dx=e[0]-r[0],dy=e[1]-r[1],dz=e[2]-r[2],rd=Math.hypot(dx,dy,dz)||1e-6,u=[dx/rd,dy/rd,dz/rd],d=Math.min(Math.max(rd,.05),L1+L2-.005),a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
  let v=[0,up===undefined?.55:up,sg];const k=v[0]*u[0]+v[1]*u[1]+v[2]*u[2];v=[v[0]-k*u[0],v[1]-k*u[1],v[2]-k*u[2]];let vl=Math.hypot(v[0],v[1],v[2]);if(vl<1e-4){v=[0,0,sg];vl=1}
  const q=[r[0]+u[0]*a+v[0]/vl*h,r[1]+u[1]*a+v[1]/vl*h,r[2]+u[2]*a+v[2]/vl*h];if(q[1]<.04)q[1]=.04;return q}   // v3.140: a limp elbow/knee folds out to the side and a little up (never a bridge of bone straight up), kept above the floor
function poleBend(r,e,L1,L2,pv){const dx=e[0]-r[0],dy=e[1]-r[1],dz=e[2]-r[2],rd=Math.hypot(dx,dy,dz)||1e-6,u=[dx/rd,dy/rd,dz/rd],d=Math.min(Math.max(rd,.05),L1+L2-.005),a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a)),k=pv[0]*u[0]+pv[1]*u[1]+pv[2]*u[2];let v=[pv[0]-k*u[0],pv[1]-k*u[1],pv[2]-k*u[2]],vl=Math.hypot(v[0],v[1],v[2]);if(vl<1e-4){v=[0,1,0];vl=1}return[r[0]+u[0]*a+v[0]/vl*h,r[1]+u[1]*a+v[1]/vl*h,r[2]+u[2]*a+v[2]/vl*h]}   // v3.141: two-bone bend toward an arbitrary pole direction
function ragPull(a,b,L,eq){const dx=a[0]-b[0],dy=a[1]-b[1],dz=a[2]-b[2],l=Math.hypot(dx,dy,dz)||1e-6;if(eq?Math.abs(l-L)>1e-6:l>L){const k=L/l;a[0]=b[0]+dx*k;a[1]=b[1]+dy*k;a[2]=b[2]+dz*k}}
function ragStep(f){const R=f._rg;if(!R||R.sl)return;R.n++;
  const ca=f.fx||1,sa=f.fz||0,vr0=f.vx*ca+f.vz*sa,vr1=-f.vx*sa+f.vz*ca,Q=R.q,W=R.W,P=RG_PEL,O={};
  if(R.n===1)for(const j of RG_J){const w=W[j];w[0]=vr0+.4*(w[0]-vr0);w[2]=vr1+.4*(w[2]-vr1)}
  for(const j of RG_J){const q=Q[j],w=W[j];O[j]=q.slice();w[1]-=GRAV*DT*1.2;q[0]+=(w[0]-vr0)*DT;q[1]+=w[1]*DT;q[2]+=(w[2]-vr1)*DT}
  // gentle extension on the floor: a hard KO's limbs end up sprawled, a soft KO's stay curled (the old curl/sprawl bands)
  for(const j of['fl','fr','hl','hr']){const q=Q[j];if(q[1]>CLR[j]+.02)continue;const bx=j[0]==='f'?P:Q.neck,Lt=(j[0]==='f'?.55+.3*R.u:.2+.25*R.u)*R.as[['fl','fr','hl','hr'].indexOf(j)],dx=q[0]-bx[0],dz=q[2]-bx[2],dl=Math.hypot(dx,dz)||1e-6;if(dl<Lt){const m=(Lt-dl)*.05;q[0]+=dx/dl*m;q[2]+=(Math.abs(dz)<.02?(j[1]==='l'?1:-1):dz/dl)*m}}
  if(R.side){const sd=R.side;for(const j of['fl','fr']){const q=Q[j];if(q[1]<=CLR[j]+.02){const tz=P[2]+sd*(j==='fl'?.34:.46);q[2]+=(tz-q[2])*.06;const dx=q[0]-P[0],ax=Math.abs(dx);if(ax>.62)q[0]-=Math.sign(dx)*(ax-.62)*.06}}
    const ux=(P[0]-Q.neck[0])/.55;{const q=Q[sd>0?'hl':'hr'];if(q[1]<=CLR.hl+.02){q[0]+=(Q.neck[0]+ux*.46-q[0])*.05;q[2]+=(Q.neck[2]+sd*.50-q[2])*.06}}
    {const q=Q[R.xh];q[0]+=(Q.neck[0]+ux*.30-q[0])*.05;q[2]+=(Q.neck[2]+sd*.16-q[2])*.06}
    if(Q.neck[1]<=CLR.neck+.02)Q.neck[2]+=(sd*.10-Q.neck[2])*.03}
  if(R.tuck){const h=Q[R.tuck];if(h[1]<CLR[R.tuck]+.03){const t=(R.tuck==='hl'?1:-1)*.07;h[2]+=(t-h[2])*.06}}
  if(Q.head[1]<CLR.head+.03)Q.head[2]+=(Q.neck[2]+R.hs*.09-Q.head[2])*.05;

function stickSet(nx,ny){ // VISION v3.65 — the stick reports a normalized vector; magnitude is the push (0..1), so speed scales with how far the knob is pushed. /* VISION v3.71 — CAMERA-RELATIVE: the vector is SCREEN-space (+x right = the camera's right, +y down = the camera's down/depth direction); the camera-relative rotation happens per-tick in steerFix() at the tick sync, so H0 holds screen-space and a.i holds facing-frame. */ The digital flags follow the same vector past the edge threshold, so every directional read (strikes, guard heights, jump, slip, roll, dash) works from the stick.

function steerFix(a){ // VISION v3.71 — CAMERA-RELATIVE STEERING, ALWAYS (Kev Nov 9 ~14:33 CT: "The joystick and camera combination should allow the character to move in any direction the camera is facing regardless of what's going on"): the stick (ax, az) is a SCREEN vector — screen-right is the world direction (cos yaw, sin yaw), screen-up (-az, VISION v3.73 — the up/down flip, Kev Nov 9 ~16:53 CT: stick-up moves away from the camera) is (-sin yaw, cos yaw), whatever cam.yaw is. steerFix converts it to the facing frame update() reads by rotating by (yaw - facing): with c=cos(cam.yaw), s=sin(cam.yaw), cosD=c*fx+s*fz, sinD=s*fx-c*fz, nax=cosD*ax-sinD*az, naz=sinD*ax+cosD*az. Per-tick (called from the tick sync) because both the facing (auto-turn toward the nearest foe) and cam.yaw (tracks S[1]) move every tick. ALWAYS — no provocation gate, no exploring-vs-fighting distinction: in a fight cam.yaw ≈ the facing angle (both track the foe), so camera-relative ≈ facing-relative in combat; the uniform rule is the point. Analog (stick): the raw stick vector is the desired screen vector; magnitude still scales speed. Digital (D-pad/keyboard): the held keys are the desired screen vector (wx=r-l, wz=d-u); the same R(yaw-facing) rotation gives (mf, ms) and the facing-frame flags are set past STK_EDGE. H0 itself stays screen-space — press()/stickSet() are untouched.
  const fx=a.fx,fz=a.fz,c=Math.cos(cam.yaw),s=Math.sin(cam.yaw),cosD=c*fx+s*fz,sinD=s*fx-c*fz,ax=H0.ax||0,az=-(H0.az||0); /* VISION v3.73 — UP/DOWN FLIP: the screen-down component is negated, so stick-up (-az in H0) maps to away-from-camera (+z at yaw 0) and stick-down (+az) maps to toward-camera (-z) — the PDF's standard third-person convention; left/right (ax) unchanged. The sidestep gate below reads the flipped az, so the lateral flags flip with it. */
  if(ax||az){
    const nax=cosD*ax-sinD*az,naz=sinD*ax+cosD*az;
    a.i.ax=nax;a.i.az=naz;
    // VISION v3.71 — SIDESTEP GATE (strengthened from v3.70): the digital flags gate on the SCREEN-space component (the player's actual stick direction), direction from the transformed sign — AND the lateral flag fires only when the lateral component DOMINATES the forward component in the facing frame (|naz|>|nax|). The v3.70 gate alone is not enough under the camera-relative contract: a straight WORLD walk with a rotated camera needs a DIAGONAL screen vector (e.g. (0.91,-0.41) for west at yaw -2.72), so the screen check passes and a spurious sidestep burst fires — the explore probe's west leg proved it (one burst drifted the player 1.55 m north into the training dummy at (-6,2.7) and stuck them at x=-5.40). The analog velocity already carries the full screen direction, so the sidestep must only fire when the player really pushes sideways — primarily lateral, not a diagonal that happens to have a lateral component. A pure sideways push (|naz|=1,|nax|=0) still fires; a 45-degree diagonal does not (it walks diagonally instead of lurching).
    a.i.r=(Math.abs(ax)>STK_EDGE&&nax>0)?1:0;a.i.l=(Math.abs(ax)>STK_EDGE&&nax<0)?1:0;a.i.d=(Math.abs(az)>STK_EDGE&&Math.abs(naz)>Math.abs(nax)&&naz>0)?1:0;a.i.u=(Math.abs(az)>STK_EDGE&&Math.abs(naz)>Math.abs(nax)&&naz<0)?1:0;
  }else{
    const wx=(H0.r?1:0)-(H0.l?1:0),wz=(H0.u?1:0)-(H0.d?1:0),mf=cosD*wx-sinD*wz,ms=sinD*wx+cosD*wz; /* VISION v3.73 — UP/DOWN FLIP: wz is now u-d (was d-u), so KeyW/D-pad ▲ maps to away-from-camera and KeyS/D-pad ▼ maps to toward-camera, matching the analog flip. */
    a.i.r=mf>STK_EDGE?1:0;a.i.l=mf<-STK_EDGE?1:0;a.i.d=ms>STK_EDGE?1:0;a.i.u=ms<-STK_EDGE?1:0;
  }
}

const _camPtrs=new Map();let _camPinch=0,_camTapT=0,_camTapX=0,_camTapY=0,_camDownT=0,_camDownX=0,_camDownY=0,_camOrbit=false,_camMidX=null,_camMidY=null,_orbL=0,_orbR=0; /* VISION v3.72 — ORBIT input state: _camOrbit (this one-finger drag started with Shift held — it orbits, not pans), _camMidX/_camMidY (previous two-finger midpoint, for the orbit delta), _orbL/_orbR (Shift+←/→ held, applied per-tick in tick()). */

const _camEnd=e=>{_camPtrs.delete(e.pointerId);if(_camPtrs.size<2){_camPinch=0;_camMidX=null;_camMidY=null}if(_camPtrs.size===0)_camOrbit=false;if(performance.now()-_camDownT<300&&Math.hypot(e.clientX-_camDownX,e.clientY-_camDownY)<12){const now=performance.now();if(now-_camTapT<350&&Math.hypot(e.clientX-_camTapX,e.clientY-_camTapY)<24){cam.px=0;cam.py=0;cam.zm=1;_camTapT=0}else{_camTapT=now;_camTapX=e.clientX;_camTapY=e.clientY}}};

 if(e)e.textContent=`Landings: ${HIT_METRICS.landings} | First contact: ${HIT_METRICS.lastImpactJoint} | descent ${HIT_METRICS.lastImpactSpeed} m/s | clearance ${HIT_METRICS.lastContactClearance} m`;

document.getElementById('hit-record').onclick=()=>{
 if(hitRecorder&&hitRecorder.state==='recording')return;   // v3.139 AUDIT FIX — no overlapping sessions
 const rec=document.getElementById('hit-record'),stp=document.getElementById('hit-stop');let stream=null;
 const idle=()=>{rec.disabled=false;stp.disabled=true},stopTracks=()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(_e){}};
 try{
  if(!cv.captureStream||!window.MediaRecorder)throw Error('Canvas recording unsupported in this browser');
  stream=cv.captureStream(30);const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  hitChunks=[];const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);hitRecorder=recorder;
  recorder.ondataavailable=e=>{if(e.data.size)hitChunks.push(e.data)};
  recorder.onerror=()=>{stopTracks();idle();hitRecorder=null};
  recorder.onstop=()=>{
   stopTracks();idle();
   if(!hitChunks.length)return;   // nothing captured: leave the previous save link alone
   const blob=new Blob(hitChunks,{type:recorder.mimeType||'video/webm'});
   if(hitVideoUrl)URL.revokeObjectURL(hitVideoUrl);
   hitVideoUrl=URL.createObjectURL(blob);
   const a=document.getElementById('hit-save');a.href=hitVideoUrl;a.download='HIT-throw-review-actual-canvas.webm';a.hidden=false;
   window.__hitBlob=blob;if(!a._dl){a._dl=1;a.addEventListener('click',async ev=>{try{const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(d&&window.__hitBlob){ev.preventDefault();await d.save({filename:'HIT-throw-review-actual-canvas.webm',data:window.__hitBlob})}}catch(_e){}})}   /* v3.142 — RECORDER SAVE: the hosted viewer blocks a plain download link; when the page's downloads capability is granted the click saves through it (the viewer confirms), otherwise the normal link still works */
  };
  recorder.start(500);
  rec.disabled=true;stp.disabled=false;
 }catch(e){stopTracks();idle();hitRecorder=null;alert('Recording unavailable: '+e.message)}   // v3.139 AUDIT FIX — a failed start stops the capture tracks and restores the buttons
};

    function write(i, tx, ty, dx, dy, t) {
      U.set([tx, ty, dx, dy, W, H, t, P.bloom, P.threshold, P.vignette, P.grain, P.grade, P.sharp, 0]);
      dev.queue.writeBuffer(ubs[i], 0, U);
    }
    let lost = null;
    dev.lost.then(r => { lost = r; fail(new Error('GPU device lost: ' + (r.message || r.reason))); });
    return {
      name: 'WebGPU',
      frame(now) {
        if (lost) return;
        const w = cv.width, h = cv.height;
        if (w < 2 || h < 2) return;
        if (w !== W || h !== H) alloc(w, h);
        dev.queue.copyExternalImageToTexture({ source: cv }, { texture: src }, [w, h]);
        const t = (now / 1000) % 1000;
        write(0, 1 / w, 1 / h, 0, 0, t);
        write(1, 1 / bw, 1 / bh, 1, 0, t);
        write(2, 1 / bw, 1 / bh, 0, 1, t);
        write(3, 1 / w, 1 / h, 0, 0, t);
        const enc = dev.createCommandEncoder();
        const pass = (view, pl, group) => {
          const p = enc.beginRenderPass({ colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
          p.setPipeline(pl); p.setBindGroup(0, group); p.draw(3); p.end();
        };
        pass(ta.createView(), pBright, bg[0]);
        pass(tb.createView(), pBlur, bg[1]);
        pass(ta.createView(), pBlur, bg[2]);
        pass(ctx.getCurrentTexture().createView(), pComp, bg[3]);
        dev.queue.submit([enc.finish()]);
      }
    };
  }

  // ---------- WebGL2 backend ----------
  function initGL() {
    const gl = ov.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false });
    if (!gl) throw new Error('WebGL2 is not available in this browser');
    const VS = `#version 300 es
out vec2 uv;
void main(){ vec2 q = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0); uv = q * 0.5 + 0.5; gl_Position = vec4(q, 0.0, 1.0); }`;
    const sh = (type, code) => {
      const s = gl.createShader(type); gl.shaderSource(s, code); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('GLSL: ' + gl.getShaderInfoLog(s));
      return s;
    };
    const vs = sh(gl.VERTEX_SHADER, VS);
    const NAMES = ['t1', 't2', 'texel', 'dir', 'res', 'time', 'bloom', 'threshold', 'vignette', 'grain', 'grade', 'sharp'];
    const prog = (body) => {
      const p = gl.createProgram();
      gl.attachShader(p, vs); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, GL_HEAD + body)); gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('GL link: ' + gl.getProgramInfoLog(p));
      const loc = {}; for (const n of NAMES) loc[n] = gl.getUniformLocation(p, n);
      return { p, loc };
    };
    const pBright = prog(GL_FS.bright), pBlur = prog(GL_FS.blur), pComp = prog(GL_FS.comp);
    const vao = gl.createVertexArray();
    const tex = () => {
      const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    };
    const src = tex(), ta = tex(), tb = tex();
    const fa = gl.createFramebuffer(), fb = gl.createFramebuffer();
    let W = 0, H = 0, bw = 0, bh = 0, lost = false;
    ov.addEventListener('webglcontextlost', (e) => { e.preventDefault(); lost = true; fail(new Error('WebGL context lost')); });
    function alloc(w, h) {
      W = w; H = h; bw = Math.max(1, w >> 2); bh = Math.max(1, h >> 2);
      for (const [t, f] of [[ta, fa], [tb, fb]]) {
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, bw, bh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, f);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, vw, vh); gl.useProgram(pr.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, a);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, b);
      const L = pr.loc;
      gl.uniform1i(L.t1, 0); gl.uniform1i(L.t2, 1);
      gl.uniform2f(L.texel, tx, ty); gl.uniform2f(L.dir, dx, dy); gl.uniform2f(L.res, W, H);
      gl.uniform1f(L.time, t); gl.uniform1f(L.bloom, P.bloom); gl.uniform1f(L.threshold, P.threshold);
      gl.uniform1f(L.vignette, P.vignette); gl.uniform1f(L.grain, P.grain); gl.uniform1f(L.grade, P.grade); gl.uniform1f(L.sharp, P.sharp);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    return {
      name: 'WebGL2',
      frame(now) {
        if (lost) return;
        const w = cv.width, h = cv.height;
        if (w < 2 || h < 2) return;
        if (w !== W || h !== H) alloc(w, h);
        gl.bindVertexArray(vao);
        gl.bindTexture(gl.TEXTURE_2D, src);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, cv);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        const t = (now / 1000) % 1000;
        pass(fa, bw, bh, pBright, src, src, 1 / w, 1 / h, 0, 0, t);
        pass(fb, bw, bh, pBlur, ta, ta, 1 / bw, 1 / bh, 1, 0, t);
        pass(fa, bw, bh, pBlur, tb, tb, 1 / bw, 1 / bh, 0, 1, t);
        pass(null, w, h, pComp, src, ta, 1 / w, 1 / h, 0, 0, t);

  // ---------- wiring ----------
  let R = null, last = 0;
  function place() {
    const r = cv.getBoundingClientRect();
    const s = ov.style, px = (n) => Math.round(n) + 'px';
    if (s.left !== px(r.left)) s.left = px(r.left);
    if (s.top !== px(r.top)) s.top = px(r.top);
    if (s.width !== px(r.width)) s.width = px(r.width);
    if (s.height !== px(r.height)) s.height = px(r.height);
    if (ov.width !== cv.width) ov.width = cv.width;
    if (ov.height !== cv.height) ov.height = cv.height;
    badge.style.left = px(r.left + 10); badge.style.top = px(r.top + 10);
  }
  function show(on) {
    G.enabled = !!(on && R);
    ov.style.display = G.enabled ? 'block' : 'none';
    syncBtn();
  }
  function fail(e) {
    G.error = String(e && e.message || e);
    R = null; show(false);
    say('GPU FX OFF · ' + G.error);
    if (btn) btn.disabled = true;
  }
  function fx() {
    if (!G.enabled || !R) return;
    const now = performance.now();
    try { place(); R.frame(now); } catch (e) { fail(e); return; }
    if (last) G.frameMs = G.frameMs * 0.95 + (now - last) * 0.05;
    last = now;
  }
  // Run right after each game draw() so the GPU pass always sees the frame just drawn. A failure here
  // can never stop the game: fx() catches its own errors and switches itself off.
  if (typeof draw === 'function') {
    const _drawFx = draw;
    draw = function () { const r = _drawFx.apply(this, arguments); fx(); return r; };
  }

  function addButton() {
    const menu = document.getElementById('fmenu');
    if (!menu) return;
    btn = document.createElement('button');
    btn.id = 'fx-btn'; btn.className = 'small'; btn.type = 'button';
    btn.setAttribute('aria-label', 'Toggle GPU world effects');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!R) return;
      show(!G.enabled);
      try { localStorage.setItem('hitGfx', G.enabled ? 'on' : 'off'); } catch (err) { /* storage unavailable */ }
      say(G.enabled ? 'GPU FX · ' + G.backend : 'GPU FX OFF');
    });
    const ib = document.getElementById('interact-btn');
    menu.insertBefore(btn, ib || null);
    syncBtn();
  }
  addButton();

  (async () => {
    if (want === '0' || want === 'off') { if (btn) btn.disabled = true; say('GPU FX OFF · ?gpu=0'); return; }
    const order = want === 'gl' ? [initGL] : want === 'webgpu' ? [initWebGPU] : [initWebGPU, initGL];
    const why = [];
    for (const init of order) {
      try {
        // A canvas keeps the first context type it is given, so a WebGPU failure after getContext needs a fresh canvas for WebGL2.
        if (why.length && init === initGL) {
          const fresh = ov.cloneNode(false); ov.replaceWith(fresh); ov = fresh;
        }
        R = await init();
        break;
      } catch (e) { why.push(String(e && e.message || e)); R = null; }
    }
    if (!R) { fail(new Error(why.join(' / ') || 'no GPU backend')); return; }
    G.backend = R.name;
    show(saved !== 'off');
    say(G.enabled ? 'GPU FX · ' + R.name : 'GPU FX ready · tap FX in MENU');
  })();
})();

<script>
/* HIT v3.179 — REAL-TIME 1v1 NETCODE.
   Design: DELAY-BASED LOCKSTEP over a WebRTC data channel.
   - The fight sim is deterministic given (initial seeds, input sequence):
     R() is a seeded LCG from a FIXED HIT_SEED (0x51a7e), the coliseum rnd()
     is a seeded LCG from a fixed seed (0x5c0177), and no Math.random() sits
     in the fight-critical path (only idle-sway phase + particles + wave spawn).
   - Both sides run the FULL sim. Each tick T is stepped with the SAME inputs
     on both sides: each player's input is captured at tick T, sent over the
     channel, and APPLIED at tick T+D (D=3 ticks = 50ms). Both sides wait
     (canStep) until the remote input for T has arrived, so the game pauses
     rather than desyncing when the network is slow.
   - Match start resets BOTH seeds + scores + round + fighters to a known
     state (via HIT_SKY_START_MATCH), so the two sims start identical.
   - Periodic resync: every 300 ticks the host sends a full fighter-state
     snapshot (positions, hp, state, HIT_SEED, rnd seed, hs/phase/pt); the
     guest snaps to it when diverged beyond epsilon. This corrects any
     floating-point drift between engines.
   - Signaling: PeerJS cloud (free, no account) for the one-link join
     (game URL + ?room=<code>), with a manual SDP code exchange as fallback
     (works even if the CDN is unreachable). Game data flows peer-to-peer
     after signaling; the cloud never sees the fight.
   - Solo play is untouched: every wrapper falls through to the original
     behaviour when NET is not active.
   v3.180 — LOBBY: the host sees a joiner live (joining -> joined -> READY ->
     not responding / left) in the panel AND in an on-screen banner with sound,
     vibration and a tab-title flag when the panel is closed. The guest has a
     READY toggle. Roles are fixed at host/join time (the guest no longer gets
     a START button), a third joiner is turned away, a guest leaving re-opens
     the room, joins time out, and the prompt() boxes are inline fields.
*/
(function () {
  'use strict';

  var VERSION = 'v3.185';
  var D = 3; // input delay, ticks (50ms at 60Hz)
  var SYNC_EVERY = 300; // ticks between host state snapshots
  var POS_EPS = 0.05; // metres; resync when a fighter is further off than this
  var STUN = { urls: 'stun:stun.l.google.com:19302' }; // free public STUN (manual path)

  // Packet: [t, wx,wz, g, bp,bk,bi,bh,bc, j]
  //   0:t tick, 1-2: WORLD-space movement vector (2dp) — the screen input
  //   rotated by the owner's cam.yaw at capture time. World space is FIXED
  //   between capture and application, unlike the facing frame: the facing
  //   auto-turns toward the velocity (up to 0.12 rad/tick), so a facing-frame
  //   packet goes stale by D ticks and the facing feedback loop amplifies
  //   the error into a growing drift (v3.179 probe: ~0.2 m/s). Each side
  //   converts world->facing at APPLICATION time with its own CURRENT facing
  //   (sim state, in sync), so both sides move identically.
  //   3: guard (held), 4-8: button PRESS EVENTS (1 = pressed this tick,
  //   0 = not) — the receiver sets the 6-tick buffer on 1 and leaves the
  //   countdown alone on 0, so a buffered press is never overwritten by a
  //   stale 0 packet. 9: jump event.
  function neutralPkt(t) { return [t, 0, 0, 0, 0, 0, 0, 0, 0, 0]; }
  function q2(v) { return Math.round((+v || 0) * 100) / 100; }

  var NET = {
    version: VERSION,
    active: false, role: null, // 'host' | 'guest'
    netTick: 0, // sim steps since match start (both sides step the same ticks)
    D: D,
    localBuf: {}, remoteBuf: {}, // netTick -> packet
    pendingBlue: null, // packet the ai/wander wrappers apply to Blue this tick
    guestJump: 0, // guest-side jump press waiting to be captured (press swap)

      panelBody.appendChild(btn('Host a match', function () { hostViaPeer(); }, 'width:100%;background:#1d2b3a;font-weight:700;margin-bottom:12px;'));
      panelBody.appendChild(el('div', 'Or join a friend’s room:', 'font-size:13px;color:#9fb4c8;margin-bottom:4px;'));
      var jr = el('div', '', 'display:flex;gap:8px;margin-bottom:10px;');
      var ji = field('input', 'flex:1;min-width:0;');
      ji.placeholder = 'Room code or link'; ji.value = joinDraft;
      ji.autocapitalize = 'characters'; ji.autocomplete = 'off'; ji.spellcheck = false;
      ji.addEventListener('input', function () { joinDraft = ji.value; });
      var doJoin = function () {
        var code = ji.value.trim(); if (!code) { ji.focus(); return; }
        joinDraft = '';
        if (code.length > 100 || /^H1[oa]\./.test(code)) joinViaManual(code); // a long blob is a manual offer, not a room code
        else joinViaPeer(code);
      };
      ji.addEventListener('keydown', function (ev) { ev.stopPropagation(); if (ev.key === 'Enter') doJoin(); });
      ji.addEventListener('keyup', function (ev) { ev.stopPropagation(); });
      jr.appendChild(ji); jr.appendChild(btn('Join', doJoin, 'flex:none;'));
      panelBody.appendChild(jr);
      var manual = el('div', '', 'font-size:13px;color:#8a9aa8;margin-top:4px;line-height:1.35;');
      var tog = el('a', 'manual codes instead', 'color:#7fb3d5;cursor:pointer;text-decoration:underline;');
      tog.addEventListener('click', function () { hostViaManual(); });
      manual.appendChild(document.createTextNode('Link lobby not loading? Host with '));
      manual.appendChild(tog);
      manual.appendChild(document.createTextNode(' — you send one code, your friend pastes it in the box above and sends one back.'));
      panelBody.appendChild(manual);
    }

    if (!NET.active && (S_ === 'opening' || S_ === 'joining')) {
      panelBody.appendChild(slotRow(C_CONN, true, S_ === 'opening' ? 'Opening room…' : 'Connecting to the host…', 'This usually takes a few seconds'));
      panelBody.appendChild(btn('Cancel', function () { leaveMatch(); }, 'background:#333;margin-top:4px;'));
    }

    // Host lobby: both player slots, live.
    if (!NET.active && NET.role === 'host' && (S_ === 'hosting' || S_ === 'hosting-manual' || S_ === 'connected')) {
      var g = guestView();
      panelBody.appendChild(el('div', 'PLAYERS', 'font-size:11px;font-weight:700;letter-spacing:.08em;color:#8a9aa8;margin:10px 0 6px;'));
      panelBody.appendChild(slotRow(C_READY, false, myName() + ' (you)', 'Host', 'RED'));
      panelBody.appendChild(slotRow(g.c, g.pulse, g.t, g.s, 'BLUE'));
      if (NET.oppVer && NET.oppVer !== VERSION) panelBody.appendChild(note('Your friend is on ' + NET.oppVer + ' and you are on ' + VERSION + '. Different versions drift apart in a fight — both use the same file.'));
    }

    if (S_ === 'hosting' && NET.roomCode) {
      var linkBox = el('div', '', 'margin:10px 0 6px;');
      var codeRow = el('div', '', 'display:flex;align-items:baseline;gap:10px;margin-bottom:8px;');
      codeRow.appendChild(el('div', 'Room code', 'font-size:13px;color:#9fb4c8;'));
      codeRow.appendChild(el('div', shortRoom(), 'font:700 26px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;'));
      linkBox.appendChild(codeRow);
      var copyRow = el('div', '', 'display:flex;gap:8px;flex-wrap:wrap;');
      if (linkShareable()) {
        var inp = field('input', 'font-size:14px;margin-bottom:8px;');
        inp.value = roomLink(); inp.readOnly = true;
        inp.addEventListener('click', function () { inp.select(); });
        linkBox.appendChild(inp);
        var cb = btn('Copy link', function () { copyText(roomLink(), cb); });
        copyRow.appendChild(cb);
        if (navigator.share) copyRow.appendChild(btn('Share…', function () {
          try { navigator.share({ title: 'HIT 1v1', text: 'Fight me in HIT — room ' + shortRoom(), url: roomLink() }).catch(function () {}); } catch (_e) {}
        }));
      } else {
        linkBox.appendChild(note('This copy of the game is not on a web address, so there is no link to send. Your friend opens their copy, taps MULTIPLAYER and enters the code.', '#8a9aa8'));
      }
      if (!linkShareable() && navigator.share) copyRow.appendChild(btn('Share code…', function () { // v3.182: iMessage share sheet
        try { navigator.share({ text: 'Fight me in HIT! Open the game, tap MULTIPLAYER, enter room code ' + shortRoom() + ' and tap Join.' }).catch(function () {}); } catch (_e) {}
      }));
      var cc = btn('Copy code', function () { copyText(shortRoom(), cc); }, linkShareable() ? 'background:#333;' : '');
      copyRow.appendChild(cc);
      copyRow.appendChild(btn('Manual codes', function () { hostViaManual(); }, 'background:#333;'));
      linkBox.appendChild(copyRow);
      panelBody.appendChild(linkBox);
    }

    if (S_ === 'hosting-manual' && NET.manualOffer) {
      panelBody.appendChild(el('div', '1. Send your offer code to your friend:', 'font-size:13px;color:#9fb4c8;margin:8px 0 4px;'));
      var o = field('textarea', 'height:64px;font-size:12px;');
      o.value = NET.manualOffer; o.readOnly = true;
      o.addEventListener('click', function () { o.select(); });
      panelBody.appendChild(o);
      var ob = btn('Copy offer code', function () { copyText(NET.manualOffer, ob); }, 'margin-top:6px;');
      panelBody.appendChild(ob);
      panelBody.appendChild(el('div', '2. Paste the answer code they send back:', 'font-size:13px;color:#9fb4c8;margin:12px 0 4px;'));
      var ai_ = field('textarea', 'height:64px;font-size:12px;');
      ai_.placeholder = 'Answer code'; ai_.value = answerDraft;
      ai_.addEventListener('input', function () { answerDraft = ai_.value; });
      ai_.addEventListener('keydown', function (ev) { ev.stopPropagation(); });
      ai_.addEventListener('keyup', function (ev) { ev.stopPropagation(); });
      panelBody.appendChild(ai_);
      panelBody.appendChild(btn('Connect', function () {
        var code = ai_.value.trim(); if (!code) { ai_.focus(); return; }
        answerDraft = ''; hostAcceptManualAnswer(code);
      }, 'margin-top:6px;background:#1d2b3a;font-weight:700;'));
    }

    if (S_ === 'guest-manual-answer' && NET.manualAnswer) {
      var a = field('textarea', 'height:64px;font-size:12px;');
      a.value = NET.manualAnswer; a.readOnly = true;
      a.addEventListener('click', function () { a.select(); });
      panelBody.appendChild(a);
      var ab = btn('Copy answer code', function () { copyText(NET.manualAnswer, ab); }, 'margin-top:6px;');
      panelBody.appendChild(ab);
    }

    if (S_ === 'connected' && !NET.active) {
      if (NET.role !== 'guest') {
        var rdy = NET.guestState === 'ready', wait = NET.guestState === 'connecting';
        var sb = btn(rdy ? 'START MATCH' : (wait ? 'Waiting for player…' : 'START ANYWAY'), function () { hostStart(); },
          'width:100%;font-weight:700;margin-top:6px;' + (rdy ? 'background:#1d6a35;border-color:#2f8f4e;' : 'background:#2a3138;'));
        if (wait) { sb.disabled = true; sb.style.opacity = '.55'; sb.style.cursor = 'default'; }
        panelBody.appendChild(sb);
      } else {
        panelBody.appendChild(el('div', 'PLAYERS', 'font-size:11px;font-weight:700;letter-spacing:.08em;color:#8a9aa8;margin:10px 0 6px;'));
        panelBody.appendChild(slotRow(C_READY, false, NET.oppName || 'Host', 'Host — starts the match', 'RED'));
        panelBody.appendChild(slotRow(NET.myReady ? C_READY : C_JOIN, false, myName() + ' (you)', NET.myReady ? 'Ready — waiting for the host to start' : 'Not ready yet', 'BLUE'));
        if (NET.oppVer && NET.oppVer !== VERSION) panelBody.appendChild(note('The host is on ' + NET.oppVer + ' and you are on ' + VERSION + '. Different versions drift apart in a fight — both use the same file.'));
        panelBody.appendChild(btn(NET.myReady ? 'NOT READY' : 'READY', function () { setReady(!NET.myReady); },
          'width:100%;font-weight:700;margin-top:6px;' + (NET.myReady ? 'background:#333;' : 'background:#1d6a35;border-color:#2f8f4e;')));
      }
    }

    if (!NET.active && (S_ === 'hosting' || S_ === 'hosting-manual' || S_ === 'connected' || S_ === 'guest-manual-answer')) {
      panelBody.appendChild(btn(NET.role === 'guest' ? 'Leave room' : 'Close room', function () { sendRaw({ k: 'bye' }); leaveMatch(); },
        'width:100%;background:none;border-color:#444;color:#b9c4cf;font-size:14px;margin-top:8px;'));
    }
    if (NET.active) {
      panelBody.appendChild(btn('Leave match', function () { sendRaw({ k: 'bye' }); leaveMatch(); }, 'background:#5a1f1f;border-color:#7a2e2e;margin-top:6px;'));
    }
  }

  function renderStall(show) {
    if (!stallBadge) {
      stallBadge = el('div', 'Waiting for opponent…', 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99999;background:#332200;color:#ffd97a;border:1px solid #8a6d1f;border-radius:8px;padding:6px 12px;font-size:14px;display:none;');
      document.body.appendChild(stallBadge);
    }
    stallBadge.style.display = show ? 'block' : 'none';
  }

  function closePanel() { if (panel) panel.style.display = 'none'; renderBanner(); }

  function buildPanel() {
    panel = el('div', null, 'position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:99990;');
    var card = el('div', null, 'width:min(560px,92vw);max-height:86vh;overflow:auto;box-sizing:border-box;background:#14181d;color:#fff;border:1px solid #3a4550;border-radius:14px;padding:18px;font-family:system-ui,sans-serif;');
    var head = el('div', '', 'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;');
    head.appendChild(el('div', 'MULTIPLAYER — real-time 1v1', 'font-size:19px;font-weight:700;'));
    var x = el('button', '✕', 'background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:6px 10px;');
    x.setAttribute('aria-label', 'Close');
    x.addEventListener('click', closePanel);
    head.appendChild(x);
    card.appendChild(head);
    card.appendChild(el('div', 'One link, one fight. You are RED when you host, BLUE when you join. Your async character rides along if you made one. You can close this and keep playing — a banner tells you when someone joins.', 'font-size:13px;color:#8a9aa8;margin-bottom:8px;line-height:1.35;'));
    panelBody = el('div', null, '');
    card.appendChild(panelBody);
    panel.appendChild(card);
    panel.addEventListener('click', function (ev) { if (ev.target === panel) closePanel(); });
    document.body.appendChild(panel);
    renderPanel();
  }

  function openPanel() {
    if (!panel) buildPanel();
    panel.style.display = 'flex';
    document.title = baseTitle;
    renderPanel();
  }

  /* ---------- wire the MENU button + auto-join ---------- */

  function addMenuButton() {
    // The menu is the v3.123 hold-menu; the FIGHTERS button was added the same way.
    var btns = document.querySelectorAll('button');
    var anchor = null;
    btns.forEach(function (b) { if (b.textContent && b.textContent.trim() === 'FIGHTERS') anchor = b; });
    var b = el('button', 'MULTIPLAYER', 'padding:10px 14px;border-radius:10px;border:1px solid #555;background:#1d2b3a;color:#fff;font-size:16px;cursor:pointer;margin-top:8px;');
    b.addEventListener('click', function () { openPanel(); });
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(b, anchor.nextSibling);
    else {
      b.style.cssText += 'position:fixed;bottom:18px;right:18px;z-index:9999;';
      document.body.appendChild(b);
    }
  }

  function autoJoin() {
    var m = location.search.match(/[?&]room=([A-Za-z0-9\-_]+)/) || location.hash.match(/room=([A-Za-z0-9\-_]+)/);
    if (!m) return;
    setTimeout(function () { joinViaPeer(m[1]); openPanel(); }, 800);
  }

  window.HIT_NET = NET;
  NET.openPanel = openPanel;
  NET.hostStart = hostStart;
  NET.leaveMatch = leaveMatch;
  NET.hostViaPeer = hostViaPeer;
  NET.joinViaPeer = joinViaPeer;
  NET.hostViaManual = hostViaManual;
  NET.joinViaManual = joinViaManual;
  NET.hostAcceptManualAnswer = hostAcceptManualAnswer;
  NET.setReady = setReady;
  NET.closePanel = closePanel;

  try { addMenuButton(); } catch (_e) {}
  try { autoJoin(); } catch (_e) {}
})();

</script>
</body></html>
