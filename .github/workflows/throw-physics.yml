name: Throw physics evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: throw-physics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-browser:
    name: Candidate browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - run: python3 -m pip install -r tests/browser_smoke/requirements.txt
      - run: python3 -m playwright install --with-deps chromium
      - name: Check all 25 against isolated candidate
        if: ${{ !cancelled() }}
        run: python3 tests/browser_smoke/run.py --source workbench/throw-carry-ik-v1/index.html --output-dir artifacts/physics-candidate-browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: candidate-browser-${{ github.run_id }}
          path: artifacts/physics-candidate-browser/
          if-no-files-found: error
          retention-days: 30

  physics-comparison:
    name: Physics comparison (blocked candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Verify complete original and cycle provenance
        run: python3 tests/physics/verify_evidence.py
      - name: Rebuild only the isolated candidate
        run: python3 tests/physics/build_candidate.py
      - name: Reject regressions without overriding failure
        run: python3 tests/physics/compare.py --baseline-dir docs/physics/cycle-1/baseline --candidate-dir docs/physics/cycle-1/attempt-2 --output-dir artifacts/physics-comparison
      - name: Publish measured rejection report
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f artifacts/physics-comparison/report.md ]]; then
            cat artifacts/physics-comparison/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: physics-comparison-${{ github.run_id }}
          path: artifacts/physics-comparison/
          if-no-files-found: error
          retention-days: 30
