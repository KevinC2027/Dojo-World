name: Clean-room Combat Engine Tests

on:
  push:
    branches:
      - cleanroom/combat-engine-v1
    paths:
      - 'combat-engine-cleanroom/**'
      - '.github/workflows/combat-cleanroom.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: combat-engine-cleanroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic combat tests
        run: npm test
