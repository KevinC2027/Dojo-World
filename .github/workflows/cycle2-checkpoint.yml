name: Cycle 2 checkpoint physics gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle2-physics:
    name: Cycle 2 physics gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Verify unchanged Cycle 1 evidence and definitions
        run: python3 tests/physics/verify_evidence.py
      - name: Rebuild only the isolated Cycle 2 candidate
        run: python3 tests/physics/build_cycle2.py
      - name: Evaluate unchanged physics acceptance criteria
        run: python3 tests/physics/compare.py --baseline-dir docs/physics/cycle-1/baseline --candidate-dir docs/physics/cycle-2/revision-1 --output-dir artifacts/cycle2-physics
      - name: Preserve checkpoint failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cycle2-physics-${{ github.run_id }}
          path: artifacts/cycle2-physics/
          if-no-files-found: error
          retention-days: 30
